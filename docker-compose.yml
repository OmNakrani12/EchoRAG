version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: voicerag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voicerag_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-voicerag_audio}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      - TOP_K=${TOP_K:-5}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.35}
      - STORAGE_PATH=/app/storage
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/storage/voicerag.db}
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
